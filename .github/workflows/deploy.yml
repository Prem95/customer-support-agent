name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.PROJECT || 'agent-workflow' }}

jobs:
  build-and-push:
    if: vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}/${{ matrix.service }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ${{ matrix.service }}
          docker push --all-tags "$IMAGE"

  deploy:
    if: vars.AWS_REGION != ''
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.PROJECT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: Terraform apply (infra + new task definitions)
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -var "project=${{ env.PROJECT }}" \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "frontend_image_tag=${{ github.sha }}" \
            -var "backend_image_tag=${{ github.sha }}"
      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$PROJECT" \
            --services "$PROJECT-frontend" "$PROJECT-backend"
      - name: Show application URL
        run: |
          TASK=$(aws ecs list-tasks --cluster "$PROJECT" \
            --service-name "$PROJECT-frontend" --query 'taskArns[0]' --output text)
          ENI=$(aws ecs describe-tasks --cluster "$PROJECT" --tasks "$TASK" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "Support console: http://$IP:8080"
